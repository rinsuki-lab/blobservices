name: Test Blobmanager

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
        - 5432:5432
        env:
          POSTGRES_PASSWORD: test
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.96.0
          - 1.97.1
          - 1.98.0
          - 1.98.1
    steps:
    - uses: actions/checkout@v7
    - parallel:
      - run: sudo apt-get install -y protobuf-compiler
      - run: rustup default ${{ matrix.rust }} && cargo build --bin blobmanager
    - name: Init Database
      run: |
        psql postgres://postgres:test@localhost:5432/postgres -c 'CREATE DATABASE blobmanager'
    - run: cargo run --bin blobmanager
      env:
        DATABASE_URL: postgres://postgres:test@localhost:5432/blobmanager
