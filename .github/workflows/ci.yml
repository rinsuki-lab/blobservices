name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
        - 5432:5432
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    strategy:
      matrix:
        rust:
          - stable
          - nightly
    steps:
    - uses: actions/checkout@v7
    - run: |
        echo "$HOME/go/bin" >> $GITHUB_PATH
        echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
    - parallel:
      - run: sudo apt-get install -y protobuf-compiler
      - run: go install github.com/pgplex/pgschema@v1.12.0
      - run: brew update && brew install sqlx-cli
      - run: rustup default ${{ matrix.rust }} && rustup component add rustfmt clippy && cargo fmt --check

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@26
          cache: true
    - run: pnpm install --frozen-lockfile
      id: install-node-deps
      background: true
    - name: Init Database
      run: |
        psql postgres://postgres:test@localhost:5432/postgres -c 'CREATE DATABASE blobmanager'
        psql postgres://postgres:test@localhost:5432/postgres -c 'CREATE DATABASE blobmanager_plan'
    - run: cd blobmanager && sqlx migrate run
      env:
        DATABASE_URL: postgres://postgres:test@localhost:5432/blobmanager
    - run: cd blobmanager && ./generate_migration.sh current_diff && git diff --exit-code
      env:
        PGUSER: postgres
        PGPASSWORD: test
        PGDATABASE: blobmanager
        PGSCHEMA_PLAN_USER: postgres
        PGSCHEMA_PLAN_PASSWORD: test
        PGSCHEMA_PLAN_DB: blobmanager_plan
    - run: cargo sqlx prepare --workspace && git diff --exit-code
      env:
        DATABASE_URL: postgres://postgres:test@localhost:5432/blobmanager
    - run: pnpm buf generate && git diff --exit-code
    - run: cargo clippy
    - run: cargo build
    # test
    - run: cargo run --bin blobmanager
      id: blobmanager
      env:
        DATABASE_URL: postgres://postgres:test@localhost:5432/blobmanager
      background: true
    - run: mkdir -p $BLOBSTORE_LOCAL_ROOT_DIR; cargo run --bin blobstore_local
      id: blobstore_local
      env:
        BLOBSTORE_LOCAL_ROOT_DIR: /tmp/blobstore_local_root
      background: true
    - run: cargo run --bin blobgateway
      id: blobgateway
      env:
        BLOBGATEWAY_CONFIG_FILE: .github/ci-files/blobgateway.config.json
      background: true
    - wait: install-node-deps
    - name: Wait for daemons to listen
      shell: bash
      run: |
        for daemon in blobmanager:3001 blobstore_local:3002 blobgateway:3003; do
          name=${daemon%:*}
          port=${daemon##*:}
          echo "Waiting for $name on port $port"
          if ! timeout 60s bash -c 'until curl --silent --output /dev/null --max-time 1 "http://127.0.0.1:$1/"; do sleep 1; done' _ "$port"; then
            echo "::error::$name did not listen on port $port within 60 seconds"
            exit 1
          fi
        done
    - run: pnpm test
    - cancel: blobgateway
    - cancel: blobstore_local
    - cancel: blobmanager
