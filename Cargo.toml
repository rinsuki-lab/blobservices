[workspace]

resolver = "3"
members = [
    "blobservices_core",
    "blobmanager",
    "blobstore_local",
    "blobgateway", "blobstore_core", "blobstore_s3",
]

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
sqlx = { version = "0.9.0", features = ["postgres", "uuid", "runtime-tokio"] }
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
prost = "0.14.4"
uuid = { version = "1.23.5", features = ["v7"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "stream"] }
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1"] }
hyper-tls = "0.6.0"
url = { version = "2.5.8", features = ["serde"] }

blobservices_core = { path = "./blobservices_core" }
blobstore_core = { path = "./blobstore_core" }
